name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      
      # 安装 LLVM (whisper-rs 需要 libclang)
      - name: Install LLVM
        run: choco install llvm -y
        env:
         ChocolateyInstallLocation: C:\ProgramData\chocolatey
      
      - name: Set LIBCLANG_PATH
        run: |
          $llvmPath = "C:\Program Files\LLVM\bin"
          echo "LIBCLANG_PATH=$llvmPath" >> $env:GITHUB_ENV
          echo "PATH=$llvmPath;$env:PATH" >> $env:GITHUB_ENV
      
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings

  test:
    name: Test
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      
      - name: Install LLVM
        run: choco install llvm -y
        env:
         ChocolateyInstallLocation: C:\ProgramData\chocolatey
      
      - name: Set LIBCLANG_PATH
        run: |
          $llvmPath = "C:\Program Files\LLVM\bin"
          echo "LIBCLANG_PATH=$llvmPath" >> $env:GITHUB_ENV
          echo "PATH=$llvmPath;$env:PATH" >> $env:GITHUB_ENV
      
      - run: cargo test

  build:
    name: Build Release
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      
      - name: Install LLVM
        run: choco install llvm -y
        env:
         ChocolateyInstallLocation: C:\ProgramData\chocolatey
      
      - name: Set LIBCLANG_PATH
        run: |
          $llvmPath = "C:\Program Files\LLVM\bin"
          echo "LIBCLANG_PATH=$llvmPath" >> $env:GITHUB_ENV
          echo "PATH=$llvmPath;$env:PATH" >> $env:GITHUB_ENV
      
      - run: cargo build --release
      - name: Create zip
        run: Compress-Archive -Path target/release/voice-assistant.exe -DestinationPath voice-assistant-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: voice-assistant-windows-x64
          path: voice-assistant-windows-x64.zip

  release:
    name: Release
    runs-on: windows-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: voice-assistant-windows-x64
      - uses: softprops/action-gh-release@v2
        with:
          files: voice-assistant-windows-x64.zip
          generate_release_notes: true
